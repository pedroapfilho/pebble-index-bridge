services:
  index-bridge:
    build: .
    container_name: index-bridge
    restart: unless-stopped
    env_file:
      - .env
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    stop_grace_period: 10s
    networks:
      - traefik_proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.index-bridge.rule=Host(`index.homelab0.com`) || Host(`index.homelab0.local`)
      - traefik.http.routers.index-bridge.entrypoints=websecure
      - traefik.http.routers.index-bridge.tls=true
      - traefik.http.services.index-bridge.loadbalancer.server.port=8000
      - traefik.docker.network=traefik_proxy

networks:
  traefik_proxy:
    name: traefik_proxy
    external: true
